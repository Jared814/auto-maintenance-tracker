services:
  app:
    build:
      context: /DATA/AppData/big-bear-dockge/stacks/auto-maintenance-tracker/go-app
      dockerfile: Dockerfile
    container_name: automotive-maint-go
    restart: always
    environment:
      - APP_ENV=production
      - PORT=3000
      - AUTH_SECRET=change-this-to-a-secure-random-string-at-least-32-chars
      - DATABASE_URL=postgres://postgres:postgres@db:5432/automotivemaint
      # Cloudflare R2 (optional — remove comments to enable receipt uploads)
      # - CLOUDFLARE_R2_ACCOUNT_ID=
      # - CLOUDFLARE_R2_ACCESS_KEY_ID=
      # - CLOUDFLARE_R2_SECRET_ACCESS_KEY=
      # - CLOUDFLARE_R2_BUCKET_NAME=
      # - CLOUDFLARE_R2_PUBLIC_URL=
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: automotive-maint-go-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automotivemaint
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
