services:
  app:
    build:
      context: /DATA/AppData/big-bear-dockge/stacks/auto-maintenance-tracker
      dockerfile: Dockerfile
    container_name: automotive-maint
    restart: always
    environment:
      - NODE_ENV=production
      - AUTH_SECRET=change-this-to-a-secure-random-string-at-least-32-chars
      - AUTH_TRUST_HOST=true
      - NEXT_TELEMETRY_DISABLED=1
      # No DATABASE_URL = SQLite mode (default)
      # SQLITE_DB_PATH=/app/data/maintenance.db
      # Cloudflare R2 (optional, for receipt image uploads)
      # - CLOUDFLARE_R2_ACCOUNT_ID=
      # - CLOUDFLARE_R2_ACCESS_KEY_ID=
      # - CLOUDFLARE_R2_SECRET_ACCESS_KEY=
      # - CLOUDFLARE_R2_BUCKET_NAME=
      # - CLOUDFLARE_R2_PUBLIC_URL=
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
